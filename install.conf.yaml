- defaults:
    link:
      relink: true
      create: true
- clean: ['~']
- link:
    # file removing last login msg from terminal
    ~/.hushlogin: .hushlogin
    # git
    ~/.gitconfig: .gitconfig
    # shell
    ~/.zshrc: .zshrc
    ~/.zprofile: .zprofile
    ~/.config/starship.toml: starship.toml
    ~/.config/tmux/tmux.conf: tmux/tmux.conf
    ~/.config/bat/config: bat/config
    ~/.config/atuin/config.toml: atuin/config.toml
    # term
    ~/.config/alacritty/alacritty.toml: alacritty/alacritty.toml
    # code review
    ~/.config/tuicr/config.toml: tuicr/config.toml
    ~/.config/tuicr/themes/terminal.toml: tuicr/themes/terminal.toml
    ~/.config/tuicr/themes/terminal-syntax.tmTheme: tuicr/themes/terminal-syntax.tmTheme
    # Neovim
    ~/.config/nvim/init.lua: nvim/init.lua
    ~/.config/nvim/nvim-pack-lock.json: nvim/nvim-pack-lock.json
    ~/.config/nvim/lua:
      path: nvim/lua/*
      glob: true
    ~/.config/nvim/plugin:
      path: nvim/plugin/*
      glob: true
    ~/.config/nvim/plugin/plugins:
      path: nvim/plugin/plugins/*
      glob: true
    ~/.config/nvim/lsp:
      path: nvim/lsp/*
      glob: true
    ~/.config/nvim/after:
      path: nvim/after/*
      glob: true
    # window manager
    ~/.config/aerospace/aerospace.toml: aerospace/aerospace.toml
    # jetbrains
    ~/.ideavimrc: .ideavimrc
    ~/bin/:
      path: bin/*
      glob: true
