# no-clown-fiesta light, switch with: theme <dark|light>
set -g status-style fg="#727272",bg=default
set -g window-status-style fg="#727272",bg=default
set -g window-status-current-style fg="#151515",bg=default,bold
set -g pane-border-style fg="#aaaaaa"
set -g pane-active-border-style fg="#637786"
set -g popup-border-style fg="#aaaaaa"
set -g popup-style fg="#151515",bg=default
set -g message-style fg="#151515",bg="#D6D6D6"
set -g message-command-style fg="#151515",bg="#D6D6D6"
set -g mode-style fg="#151515",bg="#C6D5DE"
