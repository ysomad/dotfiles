# no-clown-fiesta dark, switch with: theme <dark|light>
set -g status-style fg="#727272",bg=default
set -g window-status-style fg="#727272",bg=default
set -g window-status-current-style fg="#E1E1E1",bg=default,bold
set -g pane-border-style fg="#373737"
set -g pane-active-border-style fg="#7E97AB"
set -g popup-border-style fg="#373737"
set -g popup-style fg="#E1E1E1",bg=default
set -g message-style fg="#E1E1E1",bg="#202020"
set -g message-command-style fg="#E1E1E1",bg="#202020"
set -g mode-style fg="#E1E1E1",bg="#38404f"
