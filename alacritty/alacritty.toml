[general]
live_config_reload = true
# no-clown-fiesta from dotfiles/themes, switch with: theme <dark|light>
import = ["~/.config/alacritty/theme.toml"]

[env]
TERM = "xterm-256color"

[font]
size = 19

[font.italic]
family = "BlexMono Nerd Font Mono"
style = "Italic"

[font.normal]
family = "BlexMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "BlexMono Nerd Font Mono"
style = "Medium"

[font.bold_italic]
family = "BlexMono Nerd Font Mono"
style = "Medium Italic"

[font.offset]
x = 0
y = 0

[scrolling]
history = 50000

[window]
decorations = "buttonless"
dynamic_padding = false
opacity = 1
title = "Terminal"

[window.padding]
x = 5
y = 0
